# The Windows app's own code for keeping devices in step, run on this machine: it writes the
# cases the phone's Kotlin is held to, and plays the PC in the end-to-end check. A tool, not
# part of the app. See README.md here and docs/TESTING.md ("In step with other devices").
[package]
name = "instep"
version = "0.0.0"
edition = "2024"
publish = false

# What the Windows files compiled here use, at the versions and features the Windows app
# names for them (its Cargo.lock is copied in by `run`, so the very same releases are built).
[dependencies]
# The Windows app's library (its `core/`, beside `src/`), where the record and the merges
# live from the release after 0.40.3 on. `run` puts it at this path in the build's container (or, for a
# Windows checkout from before it existed, the empty stand-in in `before-core/`).
nexus-core = { path = "/win/core" }
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.11"
fastrand = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
